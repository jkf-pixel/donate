<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="حملة دفء من فريق غزاوي الهوى: كسوة شتوية لـ 780 طفلاً في مخيمات النزوح بغزة. كسوة الطفل الواحد 25 دولاراً.">
<meta name="theme-color" content="#14202c">
<title>حملة دفء | فريق غزاوي الهوى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f2f3;--card:#fff;--ink:#14202c;--mute:#556270;--acc:#b8322a;--on:#fff;--line:#d9dfe3;--night:#14202c;--nightink:#f0f2f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1822;--card:#172433;--ink:#eef1f3;--mute:#9fb0bf;--acc:#ef6f5e;--on:#14202c;--line:#263748;--night:#0a1119}}
:root[data-theme="dark"]{--bg:#0f1822;--card:#172433;--ink:#eef1f3;--mute:#9fb0bf;--acc:#ef6f5e;--on:#14202c;--line:#263748;--night:#0a1119}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.8 Tajawal,"Segoe UI",Tahoma,sans-serif}
h1,h2,.num{font-family:"Reem Kufi",Tajawal,Tahoma,sans-serif;font-weight:700;line-height:1.35;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.brand{font-family:"Reem Kufi",Tajawal,sans-serif;font-weight:700;font-size:19px}
.lang button{background:none;border:1px solid var(--line);color:var(--ink);padding:3px 11px;margin-inline-start:4px;border-radius:6px;font:inherit;font-size:14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero{background:var(--night);color:var(--nightink);padding:44px 0 52px}
.hero h1{font-size:clamp(34px,7vw,58px)}
.hero p{max-width:34em;color:#c4d0da;margin:14px 0 0}
.thread{margin:30px 0 8px}
.thread svg{display:block;width:100%;height:18px}
.thread .bg{stroke:#3a4c5d;stroke-width:3;stroke-dasharray:9 7;stroke-linecap:round}
.thread .fg{stroke:#ef6f5e;stroke-width:4;stroke-dasharray:9 7;stroke-linecap:round}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.stats .num{font-size:clamp(24px,5vw,36px)}
.stats small{display:block;color:#a9b8c5;font-size:14px;line-height:1.5}
section{padding:40px 0 0}
h2{font-size:28px;margin-bottom:14px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tier{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.tier .num{font-size:26px;color:var(--acc)}
.tier.main{border-color:var(--acc);border-width:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.steps{margin:0;padding-inline-start:22px}
.steps li{margin-bottom:6px}
.addr{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:12px 0}
.addr code{flex:1;min-width:220px;direction:ltr;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:14px/1.5 ui-monospace,Consolas,monospace;word-break:break-all}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:8px;padding:10px 20px;font:700 16px Tajawal,sans-serif;cursor:pointer}
.btn:focus-visible,.lang button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#qr{display:inline-block;background:#fff;padding:10px;border-radius:8px;margin-top:6px}
#qr:empty{display:none}
.warn{color:var(--acc);font-weight:700;margin:8px 0 0;font-size:15px}
.mute{color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.toys{display:flex;gap:18px;margin-top:24px}.toys svg{width:58px;height:58px;animation:bob 3.4s ease-in-out infinite}.toys svg:nth-child(2){animation-delay:.5s}.toys svg:nth-child(3){animation-delay:1s}.toys svg:nth-child(4){animation-delay:1.5s}@keyframes bob{50%{transform:translateY(-9px) rotate(4deg)}}.thread .bg{animation:march 1.4s linear infinite}@keyframes march{to{stroke-dashoffset:-16}}button.tier{display:block;width:100%;font:inherit;color:inherit;text-align:start;cursor:pointer;transition:transform .2s}button.tier:hover{transform:translateY(-4px)}button.tier:active{transform:scale(.97)}button.tier:focus-visible{outline:3px solid var(--acc);outline-offset:2px}.thx{min-height:1.8em;color:var(--acc);font-weight:700;margin:14px 0 0}.heart{position:fixed;pointer-events:none;z-index:9;font-size:22px;animation:rise 1.1s ease-out forwards}@keyframes rise{to{transform:translate(var(--dx),-130px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.logo{display:block;width:140px;height:auto;border-radius:18px;margin:8px 0 20px}footer .logo{width:76px;margin:0 0 12px}.fresh{display:none;font-size:20px;font-weight:700;color:#f4c95d;margin:18px 0 0}
html{scroll-behavior:smooth}h2{border-inline-start:5px solid var(--acc);padding-inline-start:12px}.cta{display:inline-block;margin:22px 0 0;background:#ef6f5e;color:#14202c;text-decoration:none;font:700 17px Tajawal,sans-serif;padding:12px 30px;border-radius:999px;border:0;cursor:pointer;transition:transform .2s}.cta:hover{transform:translateY(-2px)}.cta:focus-visible{outline:3px solid #f4c95d;outline-offset:3px}.cta.ghost{background:none;color:#f0f2f3;border:1px solid #5b6d7e;margin-inline-start:10px}.hero p.fresh{color:#f4c95d}#qr{display:block;width:max-content;margin:16px auto 6px}.basis{margin:0 0 16px}
footer{margin-top:48px;background:var(--night);color:#c4d0da;padding:26px 0;font-size:15px}
</style>
</head>
